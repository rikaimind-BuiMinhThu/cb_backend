version: '3.8'

services:
  db:
    container_name: instagram_chatbot_db
    image: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: instagram_chatbot
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - db

  app:
    container_name: instagram_chatbot_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      RAILS_DATABASE_USERNAME: root
      RAILS_DATABASE_PASSWORD: 
      RAILS_DATABASE_HOST: host.docker.internal
      RAILS_DATABASE: instagram_chatbot

networks:
  db: