version: '3.8'

services:
  db:
    container_name: instagram_chatbot_db
    image: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: instagram_chatbot
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - db

  app:
    container_name: instagram_chatbot_api
    build:
      context: .
      dockerfile: Dockerfile
    command: sh ./bin/docker_start.sh
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      RAILS_DATABASE_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379/11
    volumes:
      - ./:/myapp
  redis:
    image: 'redis:6-alpine'
    container_name: redis-chatbot
    hostname: redis
    command: redis-server
    ports:
      - '6379:6379'
    volumes:
      - /var/lib/redis/data
  sidekiq:
    build:
      context: .
    container_name: sidekiq-chatbot
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    volumes:
      - ./:/myapp
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      RAILS_DATABASE_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379/11

networks:
  db:
