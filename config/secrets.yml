# You can use `rake secret` to generate a secure secret key.
development:
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE").inspect %>
  secret_refresh_token: <%= ENV.fetch("SECRET_REFRESH_TOKEN").inspect %>
  scenario_encryption_secret_key: <%= ENV.fetch("SCENARIO_ENCRYPTION_SECRET_KEY").inspect %>
  shop_name: <%= ENV.fetch("SHOPIFY_SHOP_NAME").inspect %>
  storefront_access_token: <%= ENV.fetch("SHOPIFY_STOREFRONT_ACCESS_TOKEN").inspect %>
  access_token: <%= ENV.fetch("SHOPIFY_ACCESS_TOKEN").inspect %>
